name: Bug Report
description: File a bug report to help us improve BestBefore.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Before submitting, please check the [Known Bugs & Limitations](docs/USER_GUIDE.md#6-known-bugs--limitations) section and open issues to avoid duplicates.

  - type: dropdown
    id: severity
    attributes:
      label: Severity Level
      description: Select the severity level of this bug.
      options:
        - Low (Minor visual glitch or typo)
        - Medium (Feature behaves unexpectedly, but a workaround exists)
        - High (Core feature like scanning or saving items is broken)
        - Critical (App crash, data loss, or login failure)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility / Frequency
      description: How often does this issue happen?
      options:
        - Always (100% reproducible)
        - Sometimes (Intermittent)
        - Once (Could not reproduce again)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear description of what happened.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What steps are required to recreate the issue?
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen versus what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / Device Details
      description: Include your device, OS, browser, and whether you used the live site or local dev server.
      placeholder: e.g., Chrome on macOS / Safari on iPadOS
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recording (Recommended)
      description: Paste or drag-and-drop screenshots/videos showing the issue (especially helpful for UI or scanner glitches).
      placeholder: Paste image here or drag and drop a file...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console / Error Logs (Optional)
      description: Paste any relevant browser console or terminal error messages below.
      render: shell
    validations:
      required: false
